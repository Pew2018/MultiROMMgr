name: Build legacy MultiROM Manager APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install legacy compile platform and packaging tools
        run: sdkmanager "platforms;android-23" "build-tools;30.0.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'
      - name: Build, unit test and lint
        run: gradle --no-daemon --stacktrace :MultiROMMgr:assembleRelease :MultiROMMgr:testReleaseUnitTest :MultiROMMgr:lintRelease
      - name: Verify installable APK and preserved binary assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp MultiROMMgr/build/outputs/apk/release/MultiROMMgr-release.apk dist/BitO-MultiROMMgr-001.apk
          APK=dist/BitO-MultiROMMgr-001.apk
          TOOLS="$ANDROID_HOME/build-tools/30.0.3"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee dist/badging.txt
          grep -q "package: name='com.tassadar.multirommgr'" dist/badging.txt
          grep -q "sdkVersion:'16'" dist/badging.txt
          grep -q "targetSdkVersion:'23'" dist/badging.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('MultiROMMgr/src/main/assets')
          with zipfile.ZipFile('dist/BitO-MultiROMMgr-001.apk') as apk:
              for name in ('busybox', 'bbootimg', 'gpgv', 'multirom.gpg', 'devices.json'):
                  data = apk.read('assets/' + name)
                  assert data == (root / name).read_bytes(), name + ' changed during packaging'
                  print(name, hashlib.sha256(data).hexdigest())
              devices = json.loads(apk.read('assets/devices.json'))['devices']
              op3t = next(d for d in devices if 'oneplus3t' in d['names'])
              assert op3t['manifest_url'] == ''
              assert op3t['devices'][1]['path'].endswith('/624000.ufshc/by-name/boot')
              assert 'classes.dex' in apk.namelist()
          PY
          (cd dist && sha256sum BitO-MultiROMMgr-001.apk > SHA256SUMS)
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Personal rebuild of BitOBSessiOn/MultiROMMgr, not the historical signed APK."
            echo "Signed with a fresh CI debug certificate; subsequent runs may require uninstall/reinstall."
            echo "No device runtime or flashing tests performed. See docs/ONEPLUS3T-AUDIT.md."
          } > dist/BUILD-INFO.txt
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and verification records
        uses: actions/upload-artifact@v4
        with:
          name: BitO-MultiROMMgr-001
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            MultiROMMgr/build/reports/
            MultiROMMgr/build/test-results/
          if-no-files-found: ignore
